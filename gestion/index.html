<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestión Lotería · TRC</title>
<link rel="icon" href="https://torrelodonesrugby.com/wp-content/uploads/2023/04/cropped-TRC-270x270.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../config.js"></script>
<style>
  :root { --ink:#212121; --yellow:#FFD900; --paper:#F4F3EF; --line:#DAD7CE; --muted:#666; --ok:#1E7B3A; --okbg:#E3F3E7; --warn:#8A5A00; --warnbg:#FFF2C6; --err:#B3261E; --errbg:#FBE3E1; --blue:#1F4E9A; --bluebg:#E6EEFB; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter, system-ui, sans-serif; color:var(--ink); background:var(--paper); font-size:14px; line-height:1.4; }
  button, input, select, textarea { font:inherit; }
  input, select, textarea { font-size:15px; }
  a { color:var(--blue); }
  .wrap { max-width:1440px; margin:0 auto; padding:0 24px; }
  .mono { font-family:'Space Mono', monospace; }
  .muted { color:var(--muted); }
  [hidden] { display:none !important; }

  /* cabecera */
  .top { background:var(--ink); color:#fff; border-bottom:5px solid var(--yellow); position:sticky; top:0; z-index:20; }
  .top .wrap { display:flex; align-items:center; gap:10px; height:58px; }
  .brand { font-family:Anton; font-size:24px; text-transform:uppercase; margin-right:auto; letter-spacing:.02em; }
  .brand span { color:var(--yellow); }
  .tb { background:none; border:1px solid #666; color:#fff; padding:7px 12px; cursor:pointer; }
  .tb.y { background:var(--yellow); color:var(--ink); border-color:var(--yellow); font-weight:700; }
  .who { color:#bbb; font-size:13px; margin-right:6px; }

  /* indicadores */
  .kpis { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; margin:18px 0 14px; }
  .kpi { background:#fff; border:1px solid var(--line); padding:12px 14px; }
  .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  .kpi .v { font-family:'Space Mono', monospace; font-size:24px; font-weight:700; margin-top:2px; white-space:nowrap; }
  .kpi .s { font-size:12px; color:var(--muted); }
  .kpi.hl { background:var(--ink); color:#fff; border-color:var(--ink); } .kpi.hl .v { color:var(--yellow); } .kpi.hl .l, .kpi.hl .s { color:#bbb; }
  .kpi.alert { border-color:var(--err); } .kpi.alert .v { color:var(--err); }

  /* pestañas */
  nav.tabs { display:flex; gap:2px; border-bottom:3px solid var(--ink); }
  nav.tabs button { border:0; background:#e4e2db; padding:10px 18px; cursor:pointer; font-family:'Barlow Semi Condensed'; font-weight:700; font-size:17px; text-transform:uppercase; }
  nav.tabs button.on { background:var(--ink); color:var(--yellow); }
  nav.tabs .n { display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; background:var(--yellow); color:var(--ink); font-family:Inter; font-size:12px; border-radius:10px; }
  nav.tabs .n.red { background:var(--err); color:#fff; }
  section.tab { padding:18px 0 60px; }

  h2 { font-family:'Barlow Semi Condensed'; font-weight:700; text-transform:uppercase; font-size:20px; margin:0 0 10px; }
  h3 { font-family:'Barlow Semi Condensed'; font-weight:700; text-transform:uppercase; font-size:17px; margin:20px 0 8px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .bar input[type=search] { flex:1; min-width:280px; padding:10px 12px; border:1px solid #999; background:#fff; }
  .bar select { padding:9px 10px; border:1px solid #999; background:#fff; }
  .bar .sp { flex:1; }
  .big-search { font-size:17px !important; padding:13px 14px !important; border:2px solid var(--ink) !important; }

  .btn { border:2px solid var(--ink); background:#fff; padding:6px 12px; cursor:pointer; font-weight:600; white-space:nowrap; }
  .btn.pri { background:var(--yellow); }
  .btn.dark { background:var(--ink); color:var(--yellow); }
  .btn.ghost { border-color:#bbb; color:#555; font-weight:500; }
  .btn.sm { padding:3px 9px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .lnk { background:none; border:0; color:var(--blue); text-decoration:underline; cursor:pointer; padding:0; font-size:13px; }
  .wa { display:inline-block; background:#25D366; color:#fff; text-decoration:none; font-weight:600; font-size:13px; padding:4px 9px; white-space:nowrap; }

  /* tablas */
  .tbl { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  .tbl th, .tbl td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tbl th { background:#ece9e1; font-size:11px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; cursor:default; }
  .tbl th[data-k] { cursor:pointer; } .tbl th[data-k]:hover { background:#e2ded3; }
  .tbl td.n, .tbl th.n { text-align:right; font-family:'Space Mono', monospace; white-space:nowrap; }
  .tbl tr.done td { color:#888; background:#fafaf8; }
  .tbl tr:hover td { background:#fffbe0; }
  .tbl tfoot td { font-weight:700; background:#f3f1ea; }
  .code { font-family:'Space Mono', monospace; font-weight:700; background:var(--yellow); padding:0 5px; color:var(--ink); }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
  .b-Pendiente { background:var(--warnbg); color:var(--warn); }
  .b-Parcial, .b-Fuera { background:var(--bluebg); color:var(--blue); }
  .b-Completa, .b-Liquidado { background:var(--okbg); color:var(--ok); }
  .b-Anulada, .b-Liberada { background:#eee; color:#777; }
  .b-Vencido, .b-No-vino { background:var(--errbg); color:var(--err); }
  .ok { color:var(--ok); font-weight:600; } .pend { color:var(--warn); font-weight:600; } .red { color:var(--err); font-weight:600; }

  /* pantalla Hoy */
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .col h2 { display:flex; justify-content:space-between; align-items:baseline; }
  .col h2 small { font-family:Inter; font-size:13px; text-transform:none; font-weight:500; color:var(--muted); }
  .chk { width:26px; height:26px; border:2px solid var(--ink); background:#fff; cursor:pointer; display:inline-grid; place-items:center; font-weight:700; font-size:16px; padding:0; }
  .chk.on { background:var(--ok); border-color:var(--ok); color:#fff; cursor:default; }
  .numinp { width:82px; padding:5px 6px; border:1px solid #999; font-family:'Space Mono', monospace; }
  .empty { background:#fff; border:1px dashed #bbb; padding:18px; color:var(--muted); text-align:center; }

  /* ficha */
  .ficha { background:#fff; border:1px solid var(--line); padding:14px 16px; margin-bottom:10px; }
  .ficha .h { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .ficha .nm { font-weight:700; font-size:16px; }
  .ficha .rows { display:grid; gap:6px; margin-top:10px; }
  .ficha .rw { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:6px 0; border-top:1px solid #eee; }
  .ficha .rw .lbl { width:90px; font-weight:600; }

  /* ventas */
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .barrow { display:grid; grid-template-columns:110px 1fr 90px; gap:10px; align-items:center; margin:4px 0; font-size:13px; }
  .barrow .b { height:18px; background:var(--yellow); border:1px solid #c9ab00; }
  .progress { height:14px; background:#e4e2db; margin:8px 0 2px; display:flex; }
  .progress div { height:100%; }

  /* formularios */
  .form { background:#fff; border:1px solid var(--line); padding:16px; }
  .form label, dialog label { display:block; font-weight:600; font-size:13px; margin:10px 0 4px; }
  .form input, .form select, dialog input, dialog select, dialog textarea { width:100%; padding:9px 10px; border:1px solid #999; background:#fff; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .err { color:var(--err); font-weight:600; margin-top:8px; min-height:1px; }
  dialog { border:0; padding:0; max-width:620px; width:calc(100% - 32px); box-shadow:0 10px 40px rgba(0,0,0,.35); }
  dialog.wide { max-width:860px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog .dh { background:var(--ink); color:#fff; padding:12px 18px; font-family:'Barlow Semi Condensed'; font-weight:700; font-size:19px; text-transform:uppercase; display:flex; justify-content:space-between; }
  dialog .dh button { background:none; border:0; color:#fff; font-size:20px; cursor:pointer; }
  dialog .db { padding:14px 18px; max-height:70vh; overflow:auto; }
  dialog .df { padding:0 18px 16px; display:flex; gap:8px; justify-content:flex-end; }
  .bigv { font-family:'Space Mono', monospace; font-size:28px; font-weight:700; }
  .note { background:var(--warnbg); padding:10px 12px; margin-top:10px; }
  #login { max-width:400px; margin:80px auto; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-left:6px solid var(--yellow); z-index:60; font-weight:600; }
  @media (max-width:1100px) { .kpis { grid-template-columns:repeat(3, 1fr); } .cols, .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="login" class="wrap">
  <div class="form">
    <div class="brand" style="color:var(--ink)">Lotería <span style="background:var(--yellow);padding:0 4px">TRC</span> · Gestión</div>
    <label for="lgNombre">¿Quién eres?</label>
    <select id="lgNombre"><option>Fernando</option><option>Jesús</option><option value="">Otra persona…</option></select>
    <input id="lgOtro" placeholder="Tu nombre" hidden style="margin-top:6px">
    <label for="lgPin">PIN</label>
    <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn pri" id="lgGo" style="margin-top:14px;width:100%;padding:10px">Entrar</button>
    <div class="err" id="lgErr"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top"><div class="wrap">
    <div class="brand">Lotería <span>TRC</span> · Gestión</div>
    <span class="who" id="who"></span>
    <button class="tb y" data-act="nueva">+ Nueva reserva</button>
    <button class="tb" data-act="excel">Excel de cuentas</button>
    <button class="tb" data-act="reload">Actualizar</button>
    <button class="tb" data-act="salir">Salir</button>
  </div></div>

  <div class="wrap">
    <div class="kpis" id="kpis"></div>
    <nav class="tabs" id="tabs">
      <button data-tab="hoy" class="on">Hoy</button>
      <button data-tab="compradores">Compradores</button>
      <button data-tab="tacos">Tacos <span class="n" id="nTacos"></span></button>
      <button data-tab="novinieron">No vinieron <span class="n red" id="nNoVin"></span></button>
      <button data-tab="ventas">Ventas</button>
      <button data-tab="caja">Caja</button>
      <button data-tab="registro">Registro</button>
    </nav>

    <!-- HOY -->
    <section class="tab" id="t-hoy">
      <div class="bar">
        <input type="search" id="hQ" class="big-search" placeholder="Buscar a cualquiera: apellido, teléfono, código (L-012) o número de participación">
      </div>
      <div id="hResultados" hidden></div>
      <div id="hListas">
        <p class="muted" id="hFecha" style="margin:0 0 12px"></p>
        <div class="cols">
          <div class="col"><h2>Participaciones sueltas <small id="hSCount"></small></h2><div id="hSueltas"></div></div>
          <div class="col"><h2>Tacos <small id="hTCount"></small></h2><div id="hTacos"></div></div>
        </div>
      </div>
    </section>

    <!-- COMPRADORES -->
    <section class="tab" id="t-compradores" hidden>
      <div class="bar">
        <input type="search" id="cQ" placeholder="Buscar nombre, teléfono, código o número de participación">
        <select id="cF">
          <option value="act">Todas las activas</option>
          <option value="pend">Pendientes de recoger</option>
          <option value="fuera">Con tacos sin liquidar</option>
          <option value="comp">Completas</option>
          <option value="novino">No vinieron</option>
          <option value="inact">Anuladas y liberadas</option>
          <option value="all">Todas</option>
        </select>
        <span class="sp"></span><span class="muted" id="cCount"></span>
      </div>
      <table class="tbl" id="cTbl"></table>
    </section>

    <!-- TACOS -->
    <section class="tab" id="t-tacos" hidden>
      <div class="bar">
        <input type="search" id="tQ" placeholder="Buscar titular, teléfono, ID o número de participación">
        <select id="tF">
          <option value="fuera">Sin liquidar</option>
          <option value="venc">Fuera de plazo</option>
          <option value="liq">Liquidados</option>
          <option value="all">Todos</option>
        </select>
        <span class="sp"></span>
        <button class="btn" data-act="copiarTel">Copiar teléfonos sin liquidar</button>
        <button class="btn" data-act="copiarMsg">Copiar mensaje de aviso</button>
      </div>
      <p id="tInfo" style="margin:0 0 10px"></p>
      <table class="tbl" id="tTbl"></table>
    </section>

    <!-- NO VINIERON -->
    <section class="tab" id="t-novinieron" hidden>
      <p id="nInfo" style="margin:0 0 10px"></p>
      <table class="tbl" id="nTbl"></table>
    </section>

    <!-- VENTAS -->
    <section class="tab" id="t-ventas" hidden>
      <div class="grid2">
        <div>
          <h2>Participaciones</h2>
          <div class="progress" id="vProg"></div>
          <p class="muted" style="margin:0 0 10px;font-size:12px" id="vProgTxt"></p>
          <table class="tbl" id="vPart"></table>
        </div>
        <div>
          <h2>Dinero</h2>
          <table class="tbl" id="vDinero"></table>
          <h3>Cobrado por día</h3>
          <div id="vDias"></div>
          <h3>Vendido por vinculación</h3>
          <table class="tbl" id="vVinc"></table>
        </div>
      </div>
    </section>

    <!-- CAJA -->
    <section class="tab" id="t-caja" hidden>
      <div class="grid2">
        <div>
          <h2>Pendiente de cerrar</h2>
          <p class="muted" id="kDesde" style="margin:0 0 8px"></p>
          <table class="tbl" id="kMovs"></table>
        </div>
        <div>
          <h2>Cerrar caja</h2>
          <div class="form">
            <p class="muted" style="margin:0">Contad el efectivo entre dos personas. Si hay diferencia, explicadla en las notas.</p>
            <div class="row2">
              <div><label>Esperado según la hoja</label><input id="kEsperado" disabled></div>
              <div><label>Contado en la caja (€)</label><input id="kContado" inputmode="decimal"></div>
            </div>
            <label>Quién cuenta (dos nombres)</label><input id="kFirmas" placeholder="Fernando y Jesús">
            <label>Notas</label><input id="kNotas">
            <button class="btn dark" data-act="cierre" style="margin-top:12px">Registrar cierre</button>
            <div class="err" id="kErr"></div>
          </div>
          <h3>Cierres anteriores</h3>
          <table class="tbl" id="kHist"></table>
        </div>
      </div>
    </section>

    <!-- REGISTRO -->
    <section class="tab" id="t-registro" hidden>
      <div class="bar"><input type="search" id="rQ" placeholder="Filtrar por persona, acción, código o texto"></div>
      <table class="tbl" id="rTbl"></table>
    </section>
  </div>
</div>

<dialog id="dlg"><div class="dh"><span id="dlgH"></span><button data-act="cerrarDlg" aria-label="Cerrar">×</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>

<script>
const API = window.LOTERIA_API;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const eur0 = n => (Math.round(Number(n) || 0)).toLocaleString('es-ES') + ' €';
const int = n => (Number(n) || 0).toLocaleString('es-ES');
const pl = (k, a, b) => k + ' ' + (k === 1 ? a : b);
const fecha = ymd => { if (!ymd) return ''; const p = String(ymd).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}` : ymd; };
const fechaL = ymd => { if (!ymd) return ''; const p = String(ymd).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ymd; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const dias = (a, b) => Math.round((Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 864e5);
const addD = (ymd, n) => { const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const DSEM = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const diaCorto = ymd => ymd ? DSEM[new Date(ymd + 'T12:00:00Z').getUTCDay()] + ' ' + fecha(ymd) : '';

let S = { token: null, nombre: null };
let D = null, tab = 'hoy';
const sortState = {};
try { const s = JSON.parse(sessionStorage.getItem('lot_s') || 'null'); if (s) S = s; } catch (e) {}
const saveS = () => { try { sessionStorage.setItem('lot_s', JSON.stringify(S)); } catch (e) {} };

async function api(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.token }, body)) });
  const j = await r.json();
  if (!j.ok && j.auth) { logout(); throw new Error(j.error); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j.data;
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}

/* ===== acceso ===== */
$('lgNombre').addEventListener('change', () => { $('lgOtro').hidden = $('lgNombre').value !== ''; });
$('lgPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('lgGo').click(); });
$('lgGo').addEventListener('click', async () => {
  $('lgErr').textContent = '';
  try {
    const d = await api({ action: 'login', nombre: $('lgNombre').value || $('lgOtro').value.trim(), pin: $('lgPin').value });
    S = { token: d.token, nombre: d.nombre }; saveS(); $('lgPin').value = ''; start();
  } catch (e) { $('lgErr').textContent = e.message; }
});
function logout() { S = { token: null, nombre: null }; saveS(); $('app').hidden = true; $('login').hidden = false; }
async function start() { $('login').hidden = true; $('app').hidden = false; $('who').textContent = S.nombre; await load(); }
async function load() {
  try { D = await api({ action: 'datos' }); } catch (e) { toast(e.message); return; }
  prep(); renderAll();
}

/* ===== datos derivados ===== */
const n = () => D.config.porTaco, P = () => D.config.precio;
let TAC = {};
const inactiva = r => r['Estado'] === 'Anulada' || r['Estado'] === 'Liberada';
const sPend = r => Number(r['Sueltas']) > 0 && r['Sueltas entregadas'] === '';
const tEnt = r => (TAC[r['Código']] || []).length;
const tPend = r => Math.max(0, (Number(r['Tacos']) || 0) - tEnt(r));
const pendiente = r => !inactiva(r) && (sPend(r) || tPend(r) > 0);
const noVino = r => pendiente(r) && r['Día recogida'] && r['Día recogida'] < D.hoy;
const tacoVencido = t => t['Estado'] === 'En depósito' && String(t['Fecha límite']) < D.hoy;
function prep() {
  TAC = {};
  D.tacos.forEach(t => { (TAC[t['Código reserva']] = TAC[t['Código reserva']] || []).push(t); });
}
function pagado(r) {
  return (Number(r['Importe sueltas']) || 0) + (TAC[r['Código']] || []).reduce((a, t) => a + (Number(t['Importe liquidado']) || 0), 0);
}
function porCobrar(r) {
  if (inactiva(r)) return 0;
  let x = sPend(r) ? Number(r['Sueltas']) * P() : 0;
  (TAC[r['Código']] || []).forEach(t => { if (t['Estado'] === 'En depósito') x += Number(t['Participaciones']) * P(); });
  return x + tPend(r) * n() * P();
}
function matchQ(r, q) {
  if (!q) return true;
  const num = Number(q);
  if (q.match(/^\d{1,6}$/) && (TAC[r['Código']] || []).some(t => num >= Number(t['Desde']) && num <= Number(t['Hasta']))) return true;
  return norm([r['Código'], r['Nombre'], r['Apellidos'], r['Teléfono'], r['Email']].join(' ')).includes(q);
}
function waLink(tel, msg) { return 'https://wa.me/34' + String(tel).replace(/\D/g, '').slice(-9) + '?text=' + encodeURIComponent(msg); }
function msgTaco(t) {
  return `Hola, ${String(t['Titular']).split(' ')[0]}. Te recordamos desde el Torrelodones Rugby Club que el ${D.config.limiteLiqEtiqueta.toLowerCase()} es el último día para liquidar tu taco de lotería ${t['ID']} (participaciones ${t['Desde']} a ${t['Hasta']}): trae el dinero de lo vendido y devuelve las que no hayas vendido. Martes y jueves de 18:00 a 20:00 en la oficina del club. ¡Gracias!`;
}
function msgNoVino(r) {
  const lib = D.config.diasLiberar > 0 ? ` Si no pasas antes del ${fechaL(addD(r['Día recogida'], D.config.diasLiberar))}, la reserva se liberará.` : '';
  return `Hola, ${r['Nombre']}. Tienes lotería de Navidad del Torrelodones Rugby Club reservada (código ${r['Código']}) para recoger el ${fechaL(r['Día recogida'])} y no nos consta que hayas pasado. Puedes recogerla martes o jueves de 18:00 a 20:00 en la oficina del club.${lib} ¡Gracias!`;
}

/* ===== indicadores ===== */
function renderKpis() {
  const r = D.resumen, nn = n(), p = P();
  const act = D.reservas.filter(x => !inactiva(x));
  const sinRecoger = act.reduce((a, x) => a + (sPend(x) ? Number(x['Sueltas']) : 0) + tPend(x) * nn, 0);
  const libres = r.sueltasLibres + r.tacosLibres * nn;
  const plazo = dias(D.config.limiteLiq, D.hoy);
  const k = (l, v, s, cls) => `<div class="kpi ${cls || ''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || ''}</div></div>`;
  $('kpis').innerHTML =
    k('Cobrado', eur0(r.totalCaja), `${int(r.sueltasEntregadas + r.vendidasTacos)} participaciones vendidas`, 'hl') +
    k('Quedan por vender', int(libres), `participaciones · ${eur0(libres * p)}`) +
    k('Reservado sin recoger', eur0(sinRecoger * p), `${int(sinRecoger)} participaciones`) +
    k('En tacos sin liquidar', eur0(r.importeEnDeposito), pl(r.tacosEnDeposito, 'taco fuera', 'tacos fuera')) +
    k('Caja sin cerrar', eur0(D.pendiente.total), pl(D.pendiente.movimientos.length, 'movimiento', 'movimientos'), D.pendiente.total ? 'alert' : '') +
    k('Plazo de los tacos', plazo >= 0 ? plazo + ' días' : 'Vencido', D.config.limiteLiqEtiqueta, plazo <= 5 && r.tacosEnDeposito ? 'alert' : '');
  $('nTacos').textContent = r.tacosEnDeposito || ''; $('nTacos').hidden = !r.tacosEnDeposito;
  const nv = D.reservas.filter(noVino).length;
  $('nNoVin').textContent = nv; $('nNoVin').hidden = !nv;
}

/* ===== pestañas ===== */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section.tab').forEach(s => s.hidden = s.id !== 't-' + tab);
});
function renderAll() { document.querySelector('.top .brand').innerHTML = 'Lotería <span>TRC</span> · ' + esc(D.config.numeros.join(' · ')); renderKpis(); renderHoy(); renderCompradores(); renderTacos(); renderNoVin(); renderVentas(); renderCaja(); renderRegistro(); }

/* ===== HOY ===== */
function siguienteDesde() {
  let max = 0; D.tacos.forEach(t => { if (Number(t['Hasta']) > max) max = Number(t['Hasta']); });
  return max ? max + 1 : (D.config.numDesde || 1);
}
function renderHoy() {
  $('hFecha').innerHTML = `<b>${esc(D.hoyEtiqueta)}</b> · quienes eligieron recoger hoy. Para cualquier otra persona, usa el buscador.`;
  const q = norm($('hQ').value.trim());
  $('hResultados').hidden = !q; $('hListas').hidden = !!q;
  if (q) {
    const list = D.reservas.filter(r => matchQ(r, q)).sort((a, b) => inactiva(a) - inactiva(b));
    $('hResultados').innerHTML = list.length ? list.slice(0, 30).map(ficha).join('') : '<div class="empty">Nadie coincide con la búsqueda. ¿Crear una reserva nueva? Pulsa «+ Nueva reserva» arriba.</div>';
    return;
  }
  const hoy = D.hoy;
  // Sueltas
  const sl = D.reservas.filter(r => !inactiva(r) && Number(r['Sueltas']) > 0 &&
    (r['Día recogida'] === hoy || r['Fecha entrega sueltas'] === hoy));
  sl.sort((a, b) => (a['Sueltas entregadas'] !== '') - (b['Sueltas entregadas'] !== '') || String(a['Apellidos']).localeCompare(b['Apellidos'], 'es'));
  const sDone = sl.filter(r => r['Sueltas entregadas'] !== '');
  $('hSCount').textContent = `${sDone.length} de ${sl.length} recogidas · ${eur(sDone.reduce((a, r) => a + Number(r['Importe sueltas'] || 0), 0))}`;
  $('hSueltas').innerHTML = sl.length ? `<table class="tbl"><tr><th style="width:44px"></th><th>Persona</th><th>Teléfono</th><th class="n">Part.</th><th class="n">Importe</th><th></th></tr>` +
    sl.map(r => {
      const done = r['Sueltas entregadas'] !== '';
      return `<tr class="${done ? 'done' : ''}">
        <td>${done ? '<span class="chk on">✓</span>' : `<button class="chk" title="Marcar como recogido" data-act="suel" data-c="${esc(r['Código'])}"></button>`}</td>
        <td><b>${esc(r['Nombre'])} ${esc(r['Apellidos'])}</b> <span class="muted mono">${esc(r['Código'])}</span>${r['Día recogida'] !== hoy ? ` <span class="badge b-Parcial">otro día</span>` : ''}${r['Notas'] ? `<div class="muted" style="font-size:12px">📝 ${esc(r['Notas'])}</div>` : ''}</td>
        <td class="mono">${esc(r['Teléfono'])}</td>
        <td class="n">${done ? r['Sueltas entregadas'] : r['Sueltas']}</td>
        <td class="n">${eur((done ? r['Sueltas entregadas'] : r['Sueltas']) * P())}</td>
        <td>${done ? `<span class="muted" style="font-size:12px">${esc(r['Hora entrega sueltas'])} · ${esc(r['Atendido por'])}</span> <button class="lnk" data-act="dsuel" data-c="${esc(r['Código'])}">deshacer</button>` : ''}</td></tr>`;
    }).join('') + '</table>' : '<div class="empty">Nadie ha elegido recoger sueltas hoy.</div>';

  // Tacos
  let next = siguienteDesde();
  const rows = [];
  D.reservas.filter(r => !inactiva(r)).forEach(r => {
    (TAC[r['Código']] || []).filter(t => t['Fecha entrega'] === hoy).forEach(t => rows.push({ r, t }));
    if (r['Día recogida'] === hoy) for (let i = 0; i < tPend(r); i++) { rows.push({ r, desde: next }); next += n(); }
  });
  rows.sort((a, b) => (!!a.t - !!b.t) || String(a.r['Apellidos']).localeCompare(b.r['Apellidos'], 'es'));
  const tDone = rows.filter(x => x.t).length;
  $('hTCount').textContent = `${tDone} de ${rows.length} entregados`;
  $('hTacos').innerHTML = rows.length ? `<table class="tbl"><tr><th style="width:44px"></th><th>Persona</th><th>Teléfono</th><th>Números</th><th></th></tr>` +
    rows.map((x, i) => {
      const r = x.r, t = x.t;
      if (t) return `<tr class="done"><td><span class="chk on">✓</span></td><td><b>${esc(r['Nombre'])} ${esc(r['Apellidos'])}</b> <span class="muted mono">${esc(t['ID'])}</span></td>
        <td class="mono">${esc(r['Teléfono'])}</td><td class="mono">${t['Desde']}–${t['Hasta']}</td>
        <td><span class="muted" style="font-size:12px">${esc(t['Hora entrega'])} · ${esc(t['Entregado por'])}</span> ${t['Estado'] === 'En depósito' ? `<button class="lnk" data-act="dtaco" data-id="${esc(t['ID'])}">deshacer</button>` : ''}</td></tr>`;
      return `<tr><td><button class="chk" title="Marcar como entregado" data-act="taco" data-c="${esc(r['Código'])}" data-inp="hin${i}"></button></td>
        <td><b>${esc(r['Nombre'])} ${esc(r['Apellidos'])}</b> <span class="muted mono">${esc(r['Código'])}</span></td>
        <td class="mono">${esc(r['Teléfono'])}</td>
        <td><input class="numinp" id="hin${i}" type="number" value="${x.desde}" title="Primer número del taco"> <span class="muted mono" id="hin${i}r">–${x.desde + n() - 1}</span></td><td></td></tr>`;
    }).join('') + '</table><p class="muted" style="font-size:12px">El primer número se propone solo. Si el taco que tienes en la mano empieza en otro, cámbialo antes de marcar.</p>' : '<div class="empty">Nadie ha elegido recoger tacos hoy.</div>';
}
$('hQ').addEventListener('input', renderHoy);
document.addEventListener('input', e => {
  if (e.target.classList.contains('numinp')) { const r = $(e.target.id + 'r'); if (r) r.textContent = '–' + (Number(e.target.value) + n() - 1); }
});

/* Ficha completa de una reserva (buscador y Compradores) */
function ficha(r) {
  const tk = TAC[r['Código']] || [], inact = inactiva(r);
  let rows = '';
  if (Number(r['Sueltas']) > 0 || r['Sueltas entregadas'] !== '') {
    rows += `<div class="rw"><span class="lbl">Sueltas</span>` + (r['Sueltas entregadas'] !== ''
      ? `<span class="ok">✓ ${r['Sueltas entregadas']} recogidas · ${eur(r['Importe sueltas'])}</span> <span class="muted">${fechaL(r['Fecha entrega sueltas'])} ${esc(r['Hora entrega sueltas'])} · ${esc(r['Atendido por'])}</span>` +
        (r['Fecha entrega sueltas'] === D.hoy ? ` <button class="lnk" data-act="dsuel" data-c="${esc(r['Código'])}">deshacer</button>` : '')
      : `<span class="pend">${r['Sueltas']} por recoger</span> ${inact ? '' : `<button class="btn pri sm" data-act="suel" data-c="${esc(r['Código'])}">Cobrar ${eur(r['Sueltas'] * P())} y entregar</button>`}`) + '</div>';
  }
  tk.forEach(t => {
    const v = tacoVencido(t);
    rows += `<div class="rw"><span class="lbl">Taco ${esc(t['ID'])}</span><span class="mono">${t['Desde']}–${t['Hasta']}</span> <span class="muted">entregado ${fechaL(t['Fecha entrega'])} · ${esc(t['Entregado por'])}</span> ` +
      (t['Estado'] === 'Liquidado'
        ? `<span class="ok">✓ Liquidado: ${t['Vendidas']} vendidas (${eur(t['Importe liquidado'])}), ${t['Devueltas']} devueltas</span>` + (t['Fecha liquidación'] === D.hoy ? ` <button class="lnk" data-act="dliq" data-id="${esc(t['ID'])}">deshacer</button>` : '')
        : `<span class="badge ${v ? 'b-Vencido' : 'b-Fuera'}">${v ? 'Fuera de plazo' : 'Sin liquidar'}</span> <button class="btn pri sm" data-act="liq" data-id="${esc(t['ID'])}">Liquidar</button>` + (t['Fecha entrega'] === D.hoy ? ` <button class="lnk" data-act="dtaco" data-id="${esc(t['ID'])}">deshacer entrega</button>` : '')) + '</div>';
  });
  if (!inact) for (let i = 0; i < tPend(r); i++) {
    const id = 'fin' + r['Código'] + i, d = siguienteDesde() + i * n();
    rows += `<div class="rw"><span class="lbl">Taco</span><span class="pend">por entregar</span> Primer número: <input class="numinp" id="${id}" type="number" value="${d}"> <span class="muted mono" id="${id}r">–${d + n() - 1}</span> <button class="btn dark sm" data-act="taco" data-c="${esc(r['Código'])}" data-inp="${id}">Entregar taco</button></div>`;
  }
  const est = noVino(r) ? 'No vino' : r['Estado'];
  return `<div class="ficha"><div class="h"><span class="code">${esc(r['Código'])}</span><span class="nm">${esc(r['Nombre'])} ${esc(r['Apellidos'])}</span>
    <span class="mono">${esc(r['Teléfono'])}</span><span class="muted">${esc(r['Email'])} · ${esc(r['Vinculación'])} · recogida ${diaCorto(r['Día recogida'])} · ${esc(r['Origen'])}</span>
    <span class="badge b-${est.replace(' ', '-')}" style="margin-left:auto">${esc(est)}</span></div>
    ${r['Notas'] ? `<div class="muted" style="margin-top:6px">📝 ${esc(r['Notas'])}</div>` : ''}
    <div class="rows">${rows || '<div class="muted">Sin participaciones.</div>'}</div>
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn ghost sm" data-act="nota" data-c="${esc(r['Código'])}">Añadir nota</button>
    ${!inact && r['Sueltas entregadas'] === '' && !tk.length ? `<button class="btn ghost sm" data-act="anular" data-c="${esc(r['Código'])}">Anular reserva</button>` : ''}</div></div>`;
}

/* ===== tablas con orden ===== */
function tabla(id, cols, rows, foot) {
  const st = sortState[id];
  if (st) {
    const c = cols.find(x => x.k === st.k);
    rows = rows.slice().sort((a, b) => {
      const va = c.sv ? c.sv(a) : a[st.k], vb = c.sv ? c.sv(b) : b[st.k];
      const r = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'es', { numeric: true });
      return st.d * r;
    });
  }
  $(id).innerHTML = '<thead><tr>' + cols.map(c => `<th data-t="${id}" ${c.sv || c.k ? `data-k="${c.k}"` : ''} class="${c.n ? 'n' : ''}">${c.h}${st && st.k === c.k ? (st.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(r => `<tr class="${r._cls || ''}">` + cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('') + '</tr>').join('') : `<tr><td colspan="${cols.length}" class="muted" style="text-align:center;padding:18px">Nada que mostrar.</td></tr>`) +
    '</tbody>' + (foot ? '<tfoot><tr>' + foot.map((f, i) => `<td class="${cols[i] && cols[i].n ? 'n' : ''}">${f}</td>`).join('') + '</tr></tfoot>' : '');
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-k]'); if (!th) return;
  const id = th.dataset.t, k = th.dataset.k, st = sortState[id];
  sortState[id] = { k, d: st && st.k === k ? -st.d : 1 };
  renderAll();
});

/* ===== COMPRADORES ===== */
function renderCompradores() {
  const q = norm($('cQ').value.trim()), f = $('cF').value;
  const list = D.reservas.filter(r => {
    if (!matchQ(r, q)) return false;
    switch (f) {
      case 'act': return !inactiva(r);
      case 'pend': return pendiente(r);
      case 'fuera': return (TAC[r['Código']] || []).some(t => t['Estado'] === 'En depósito');
      case 'comp': return r['Estado'] === 'Completa';
      case 'novino': return noVino(r);
      case 'inact': return inactiva(r);
    }
    return true;
  });
  if (!sortState.cTbl) list.sort((a, b) => String(a['Apellidos']).localeCompare(b['Apellidos'], 'es'));
  $('cCount').textContent = list.length + (list.length === 1 ? ' persona' : ' personas');
  const cols = [
    { h: 'Código', k: 'Código', f: r => `<span class="mono">${esc(r['Código'])}</span>` },
    { h: 'Nombre', k: 'Apellidos', f: r => `<b>${esc(r['Apellidos'])}, ${esc(r['Nombre'])}</b>` },
    { h: 'Teléfono', k: 'Teléfono', f: r => `<span class="mono">${esc(r['Teléfono'])}</span>` },
    { h: 'Vinculación', k: 'Vinculación', f: r => esc(r['Vinculación']) },
    { h: 'Recogida', k: 'Día recogida', f: r => diaCorto(r['Día recogida']) },
    { h: 'Sueltas', k: 'Sueltas', n: 1, sv: r => Number(r['Sueltas']) || 0, f: r => Number(r['Sueltas']) ? (r['Sueltas entregadas'] !== '' ? `<span class="ok">${r['Sueltas entregadas']} ✓</span>` : `<span class="pend">${r['Sueltas']}</span>`) : '–' },
    { h: 'Tacos', k: 'Tacos', sv: r => Number(r['Tacos']) || 0, f: r => {
        const tk = TAC[r['Código']] || [];
        const s = tk.map(t => `<span class="mono" title="${esc(t['ID'])}">${t['Desde']}–${t['Hasta']}</span>${t['Estado'] === 'Liquidado' ? ' ✓' : ''}`).join('<br>');
        return (s || '') + (tPend(r) && !inactiva(r) ? `${s ? '<br>' : ''}<span class="pend">${tPend(r)} por entregar</span>` : '') || '–';
      } },
    { h: 'Pagado', k: 'pag', n: 1, sv: pagado, f: r => pagado(r) ? eur(pagado(r)) : '–' },
    { h: 'Pendiente', k: 'pc', n: 1, sv: porCobrar, f: r => porCobrar(r) ? `<span class="pend">${eur(porCobrar(r))}</span>` : '–' },
    { h: 'Estado', k: 'Estado', f: r => { const e = noVino(r) ? 'No vino' : r['Estado']; return `<span class="badge b-${e.replace(' ', '-')}">${esc(e)}</span>`; } },
    { h: '', f: r => `<button class="btn sm" data-act="ficha" data-c="${esc(r['Código'])}">Ficha</button>` }
  ];
  list.forEach(r => r._cls = inactiva(r) ? 'done' : '');
  const tot = (fn) => list.reduce((a, r) => a + fn(r), 0);
  tabla('cTbl', cols, list, ['', `${list.length} personas`, '', '', '',
    int(tot(r => inactiva(r) ? 0 : Number(r['Sueltas']) || 0)), int(tot(r => inactiva(r) ? 0 : Number(r['Tacos']) || 0)) + ' tacos',
    eur(tot(pagado)), eur(tot(porCobrar)), '', '']);
}
['cQ', 'cF'].forEach(id => $(id).addEventListener('input', renderCompradores));

/* ===== TACOS ===== */
function renderTacos() {
  const q = norm($('tQ').value.trim()), f = $('tF').value, num = Number(q);
  const list = D.tacos.filter(t => {
    if (f === 'fuera' && t['Estado'] !== 'En depósito') return false;
    if (f === 'venc' && !tacoVencido(t)) return false;
    if (f === 'liq' && t['Estado'] !== 'Liquidado') return false;
    if (q) {
      const inR = /^\d{1,6}$/.test(q) && num >= Number(t['Desde']) && num <= Number(t['Hasta']);
      if (!inR && !norm([t['ID'], t['Código reserva'], t['Titular'], t['Teléfono']].join(' ')).includes(q)) return false;
    }
    return true;
  });
  if (!sortState.tTbl) list.sort((a, b) => Number(a['Desde']) - Number(b['Desde']));
  const fuera = D.tacos.filter(t => t['Estado'] === 'En depósito');
  const plazo = dias(D.config.limiteLiq, D.hoy);
  $('tInfo').innerHTML = `Plazo para liquidar: <b>${esc(D.config.limiteLiqEtiqueta)}</b> (${plazo >= 0 ? 'faltan ' + plazo + ' días' : '<span class="red">vencido</span>'}) · <b>${pl(fuera.length, 'taco', 'tacos')}</b> sin liquidar · <b>${eur(fuera.reduce((a, t) => a + Number(t['Participaciones']) * P(), 0))}</b> como máximo por cobrar.`;
  const cols = [
    { h: 'Taco', k: 'ID', f: t => `<span class="mono">${esc(t['ID'])}</span>` },
    { h: 'Titular', k: 'Titular', f: t => `<b>${esc(t['Titular'])}</b> <span class="muted mono">${esc(t['Código reserva'])}</span>` },
    { h: 'Teléfono', k: 'Teléfono', f: t => `<span class="mono">${esc(t['Teléfono'])}</span>` },
    { h: 'Números', k: 'Desde', sv: t => Number(t['Desde']), f: t => `<span class="mono">${t['Desde']}–${t['Hasta']}</span>` },
    { h: 'Entregado', k: 'Fecha entrega', f: t => `${fecha(t['Fecha entrega'])} <span class="muted">${esc(t['Entregado por'])}</span>` },
    { h: 'Estado', k: 'Estado', f: t => t['Estado'] === 'Liquidado' ? `<span class="badge b-Liquidado">Liquidado ${fecha(t['Fecha liquidación'])}</span>` : `<span class="badge ${tacoVencido(t) ? 'b-Vencido' : 'b-Fuera'}">${tacoVencido(t) ? 'Fuera de plazo' : 'Sin liquidar'}</span>` },
    { h: 'Vendidas', k: 'Vendidas', n: 1, sv: t => Number(t['Vendidas']) || 0, f: t => t['Estado'] === 'Liquidado' ? `${t['Vendidas']} / ${t['Participaciones']}` : '–' },
    { h: 'Cobrado', k: 'Importe liquidado', n: 1, sv: t => Number(t['Importe liquidado']) || 0, f: t => t['Estado'] === 'Liquidado' ? eur(t['Importe liquidado']) : '–' },
    { h: 'Por cobrar (máx.)', k: 'pc', n: 1, sv: t => t['Estado'] === 'En depósito' ? Number(t['Participaciones']) : 0, f: t => t['Estado'] === 'En depósito' ? `<span class="pend">${eur(Number(t['Participaciones']) * P())}</span>` : '–' },
    { h: '', f: t => t['Estado'] === 'En depósito'
        ? `<button class="btn pri sm" data-act="liq" data-id="${esc(t['ID'])}">Liquidar</button> <a class="wa" target="_blank" rel="noopener" href="${waLink(t['Teléfono'], msgTaco(t))}">WhatsApp</a>`
        : (t['Fecha liquidación'] === D.hoy ? `<button class="lnk" data-act="dliq" data-id="${esc(t['ID'])}">deshacer liquidación</button>` : '') }
  ];
  list.forEach(t => t._cls = t['Estado'] === 'Liquidado' ? 'done' : '');
  tabla('tTbl', cols, list);
}
['tQ', 'tF'].forEach(id => $(id).addEventListener('input', renderTacos));

/* ===== NO VINIERON ===== */
function renderNoVin() {
  const list = D.reservas.filter(noVino);
  const dl = D.config.diasLiberar;
  $('nInfo').innerHTML = `Reservas cuyo día de recogida ya pasó y tienen algo sin recoger. ` +
    (dl > 0 ? `Lo que no se recoge en <b>${dl} días</b> se libera solo y vuelve a estar a la venta.` : 'No se liberan solas.');
  if (!sortState.nTbl) list.sort((a, b) => String(a['Día recogida']).localeCompare(b['Día recogida']));
  const falta = r => [sPend(r) ? r['Sueltas'] + ' sueltas' : '', tPend(r) ? tPend(r) + (tPend(r) > 1 ? ' tacos' : ' taco') : ''].filter(Boolean).join(' + ');
  tabla('nTbl', [
    { h: 'Código', k: 'Código', f: r => `<span class="mono">${esc(r['Código'])}</span>` },
    { h: 'Nombre', k: 'Apellidos', f: r => `<b>${esc(r['Apellidos'])}, ${esc(r['Nombre'])}</b>` },
    { h: 'Teléfono', k: 'Teléfono', f: r => `<span class="mono">${esc(r['Teléfono'])}</span>` },
    { h: 'Día elegido', k: 'Día recogida', f: r => diaCorto(r['Día recogida']) },
    { h: 'Le falta', f: falta },
    { h: 'Importe', n: 1, k: 'pc', sv: porCobrar, f: r => eur(porCobrar(r)) },
    { h: 'Se libera', k: 'lib', sv: r => r['Día recogida'], f: r => dl > 0 ? (() => { const x = dias(addD(r['Día recogida'], dl), D.hoy); return x <= 0 ? '<span class="red">hoy</span>' : `en ${x} días (${fecha(addD(r['Día recogida'], dl + 1))})`; })() : '–' },
    { h: '', f: r => `<a class="wa" target="_blank" rel="noopener" href="${waLink(r['Teléfono'], msgNoVino(r))}">WhatsApp</a> <button class="btn sm" data-act="ficha" data-c="${esc(r['Código'])}">Ficha</button>` }
  ], list);
}

/* ===== VENTAS ===== */
function renderVentas() {
  const r = D.resumen, nn = n(), p = P(), c = D.config;
  const act = D.reservas.filter(x => !inactiva(x));
  const sRes = act.reduce((a, x) => a + (sPend(x) ? Number(x['Sueltas']) : 0), 0);
  const tResN = act.reduce((a, x) => a + tPend(x), 0) * nn;
  const total = c.sueltasDisp + c.tacosDisp * nn;
  const libres = r.sueltasLibres + r.tacosLibres * nn;
  const filas = [
    ['Vendidas sueltas (cobradas)', r.sueltasEntregadas, '#1E7B3A'],
    ['Vendidas en tacos (liquidadas)', r.vendidasTacos, '#2E9B4F'],
    ['En tacos sin liquidar', r.participacionesEnDeposito, '#1F4E9A'],
    ['Reservadas sueltas sin recoger', sRes, '#E0A800'],
    ['Reservadas en tacos sin entregar', tResN, '#F2C94C'],
    ['Libres para vender', libres, '#CFCAB9']
  ];
  $('vProg').innerHTML = filas.map(f => `<div title="${f[0]}: ${f[1]}" style="width:${total ? f[1] / total * 100 : 0}%;background:${f[2]}"></div>`).join('');
  $('vProgTxt').textContent = `Vendido ${total ? Math.round((r.sueltasEntregadas + r.vendidasTacos) / total * 100) : 0} % de ${int(total)} participaciones`;
  const cuadre = filas.reduce((a, f) => a + f[1], 0);
  $('vPart').innerHTML = '<tr><th>Situación</th><th class="n">Participaciones</th><th class="n">Importe</th></tr>' +
    filas.map(f => `<tr><td><span style="display:inline-block;width:10px;height:10px;background:${f[2]};margin-right:6px"></span>${f[0]}</td><td class="n">${int(f[1])}</td><td class="n">${eur(f[1] * p)}</td></tr>`).join('') +
    `<tfoot><tr><td>Total para vender (${int(c.sueltasDisp)} sueltas + ${c.tacosDisp} tacos × ${nn})</td><td class="n">${int(total)}</td><td class="n">${eur(total * p)}</td></tr></tfoot>` +
    (cuadre !== total ? `<tr><td colspan="3" class="red">Atención: la suma (${cuadre}) no cuadra con el total (${total}). Revisa la hoja.</td></tr>` : '') +
    `<tr><td class="muted" colspan="3" style="font-size:12px">Las devueltas de los tacos (${int(r.devueltasTacos)}) vuelven a las sueltas libres.</td></tr>`;
  const vend = r.sueltasEntregadas + r.vendidasTacos;
  $('vDinero').innerHTML = '<tr><th>Concepto</th><th class="n">Importe</th></tr>' +
    `<tr><td>Cobrado (caja)</td><td class="n"><b>${eur(r.totalCaja)}</b></td></tr>` +
    `<tr><td style="padding-left:24px">de sueltas</td><td class="n">${eur(r.importeSueltas)}</td></tr>` +
    `<tr><td style="padding-left:24px">de tacos liquidados</td><td class="n">${eur(r.importeTacos)}</td></tr>` +
    `<tr><td>Por cobrar: reservas sin recoger</td><td class="n">${eur((sRes + tResN) * p)}</td></tr>` +
    `<tr><td>Por cobrar: tacos sin liquidar (máximo)</td><td class="n">${eur(r.importeEnDeposito)}</td></tr>` +
    `<tr><td>Desglose de lo vendido: juega (${eur(c.jugado)} × ${int(vend)})</td><td class="n">${eur(r.jugadoEstimado)}</td></tr>` +
    `<tr><td>Desglose de lo vendido: donativo para el club (${eur(c.donativo)} × ${int(vend)})</td><td class="n">${eur(r.donativoEstimado)}</td></tr>`;
  const porDia = {};
  D.caja.forEach(m => { porDia[m['Fecha']] = (porDia[m['Fecha']] || 0) + (Number(m['Importe']) || 0); });
  const ks = Object.keys(porDia).sort(), mx = Math.max(1, ...ks.map(k => porDia[k]));
  $('vDias').innerHTML = ks.length ? ks.map(k => `<div class="barrow"><span>${diaCorto(k)}</span><div class="b" style="width:${Math.max(0, porDia[k]) / mx * 100}%"></div><span class="mono" style="text-align:right">${eur0(porDia[k])}</span></div>`).join('') : '<p class="muted">Todavía no hay cobros.</p>';
  const pv = {};
  act.forEach(x => {
    const v = x['Vinculación'] || '—';
    pv[v] = pv[v] || { personas: 0, part: 0 };
    pv[v].personas++;
    pv[v].part += (Number(x['Sueltas entregadas']) || 0) + (TAC[x['Código']] || []).reduce((a, t) => a + (Number(t['Vendidas']) || 0), 0);
  });
  $('vVinc').innerHTML = '<tr><th>Vinculación</th><th class="n">Personas</th><th class="n">Part. vendidas</th></tr>' +
    Object.keys(pv).sort((a, b) => pv[b].part - pv[a].part).map(k => `<tr><td>${esc(k)}</td><td class="n">${pv[k].personas}</td><td class="n">${int(pv[k].part)}</td></tr>`).join('');
}

/* ===== Excel de cuentas ===== */
function hoja(rows, cols) {
  const aoa = [cols.map(c => c[0])].concat(rows.map(r => cols.map(c => {
    const v = typeof c[1] === 'function' ? c[1](r) : r[c[1]];
    return (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v) && !/Teléfono|Código|ID/.test(c[0])) ? Number(v) : v;
  })));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = cols.map((c, i) => ({ wch: Math.max(10, Math.min(45, Math.max(...aoa.map(r => String(r[i] == null ? '' : r[i]).length + 2)))) }));
  return ws;
}

  const total = c.sueltasDisp + c.tacosDisp * nn;
  const libres = r.sueltasLibres + r.tacosLibres * nn;
  const tc = D.cierres.reduce((a, x) => a + (Number(x['Contado']) || 0), 0);
  const td = D.cierres.reduce((a, x) => a + (Number(x['Diferencia']) || 0), 0);
  const res = [
    ['CUENTAS · LOTERÍA DE NAVIDAD · TORRELODONES RUGBY CLUB'],
    ['Generado', fechaL(D.hoy) + ' por ' + S.nombre], ['Números', c.numeros.join(' · ')],
    ['Precio participación (€)', p], ['Juega (€)', c.jugado], ['Donativo (€)', c.donativo], ['Plazo de liquidación de tacos', fechaL(c.limiteLiq)],
    [], ['PARTICIPACIONES', 'Cantidad', 'Importe (€)'],
    ['Total para vender', total, total * p],
    ['Vendidas sueltas (cobradas)', r.sueltasEntregadas, r.sueltasEntregadas * p],
    ['Vendidas en tacos (liquidadas)', r.vendidasTacos, r.vendidasTacos * p],
    ['En tacos sin liquidar', r.participacionesEnDeposito, r.importeEnDeposito],
    ['Reservadas sueltas sin recoger', sRes, sRes * p],
    ['Reservadas en tacos sin entregar', tResN, tResN * p],
    ['Libres para vender', libres, libres * p],
    [], ['DINERO', '', 'Importe (€)'],
    ['Cobrado (movimientos de caja)', '', r.totalCaja],
    ['   de sueltas', '', r.importeSueltas], ['   de tacos liquidados', '', r.importeTacos],
    ['Contado en cierres de caja', '', tc], ['Diferencias en cierres', '', td], ['Sin cerrar ahora mismo', '', D.pendiente.total],
    ['Desglose de lo vendido: juega', '', r.jugadoEstimado], ['Desglose de lo vendido: donativo para el club', '', r.donativoEstimado],
    [], ['TACOS', 'Cantidad', ''],
    ['Ofrecidos', c.tacosDisp, ''], ['Entregados', r.tacosEntregados, ''], ['Sin liquidar', r.tacosEnDeposito, ''], ['Fuera de plazo', r.tacosVencidos, ''], ['Liquidados', r.tacosLiquidados, ''], ['Participaciones devueltas', r.devueltasTacos, '']
  ];
  const wsR = XLSX.utils.aoa_to_sheet(res); wsR['!cols'] = [{ wch: 46 }, { wch: 14 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumen');
  XLSX.utils.book_append_sheet(wb, hoja(D.reservas, [
    ['Código', 'Código'], ['Apellidos', 'Apellidos'], ['Nombre', 'Nombre'], ['Teléfono', 'Teléfono'], ['Email', 'Email'], ['Vinculación', 'Vinculación'],
    ['Estado', x => noVino(x) ? 'No vino' : x['Estado']], ['Día recogida', 'Día recogida'],
    ['Sueltas reservadas', 'Sueltas'], ['Sueltas recogidas', 'Sueltas entregadas'], ['Tacos reservados', 'Tacos'],
    ['Números de sus tacos', x => (TAC[x['Código']] || []).map(t => t['Desde'] + '-' + t['Hasta']).join(', ')],
    ['Pagado (€)', pagado], ['Pendiente (€)', porCobrar], ['Notas', 'Notas']]), 'Compradores');
  XLSX.utils.book_append_sheet(wb, hoja(D.tacos, [
    ['ID', 'ID'], ['Titular', 'Titular'], ['Teléfono', 'Teléfono'], ['Desde', 'Desde'], ['Hasta', 'Hasta'], ['Participaciones', 'Participaciones'],
    ['Entregado', 'Fecha entrega'], ['Entregado por', 'Entregado por'], ['Estado', t => tacoVencido(t) ? 'Fuera de plazo' : t['Estado']],
    ['Vendidas', 'Vendidas'], ['Devueltas', 'Devueltas'], ['Cobrado (€)', 'Importe liquidado'],
    ['Por cobrar máx. (€)', t => t['Estado'] === 'En depósito' ? Number(t['Participaciones']) * p : 0], ['Liquidado el', 'Fecha liquidación'], ['Notas', 'Notas']]), 'Tacos');
  XLSX.utils.book_append_sheet(wb, hoja(D.caja, [['Fecha', 'Fecha'], ['Hora', 'Hora'], ['Concepto', 'Concepto'], ['Código', 'Código'], ['Importe (€)', 'Importe'], ['Cobrado por', 'Cobrado por']]), 'Caja');
  XLSX.utils.book_append_sheet(wb, hoja(D.cierres, [['Fecha', 'Fecha'], ['Hora', 'Hora'], ['Esperado (€)', 'Esperado'], ['Contado (€)', 'Contado'], ['Diferencia (€)', 'Diferencia'], ['Firmas', 'Firmas'], ['Notas', 'Notas']]), 'Cierres');
  XLSX.utils.book_append_sheet(wb, hoja(D.reservas.filter(noVino), [['Código', 'Código'], ['Apellidos', 'Apellidos'], ['Nombre', 'Nombre'], ['Teléfono', 'Teléfono'], ['Día elegido', 'Día recogida'], ['Pendiente (€)', porCobrar]]), 'No vinieron');
  XLSX.utils.book_append_sheet(wb, hoja(D.registro, [['Fecha', 'Fecha'], ['Hora', 'Hora'], ['Quién', 'Usuario'], ['Acción', 'Acción'], ['Código', 'Código'], ['Detalle', 'Detalle']]), 'Registro');
  XLSX.writeFile(wb, 'Loteria_TRC_cuentas_' + D.hoy + '.xlsx');
}

if (S.token) start();
</script>
